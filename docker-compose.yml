# Postgres apenas para desenvolvimento local.
# Credenciais vêm do .env (não versionado); os defaults servem para subir rápido.
services:
  postgres:
    image: postgres:16-alpine
    container_name: cobem_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cobem}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-localdev}
      POSTGRES_DB: ${POSTGRES_DB:-cobem}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - cobem_pgdata:/var/lib/postgresql/data
    healthcheck:
      test:
        ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cobem} -d ${POSTGRES_DB:-cobem}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  cobem_pgdata:
